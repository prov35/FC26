<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC26 Pack Draft</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0e1a;--panel:#121829;--line:#222b45;--txt:#eef1fa;--mut:#8a94b3;--acc:#2ee6a6;--p1:#4d9bff;--p2:#ff6b8b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#18254a,var(--bg));color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{text-align:center;padding:22px 12px 6px}
h1{margin:0;font-size:26px;letter-spacing:.12em;font-weight:800}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.list.active{box-shadow:0 0 0 2px var(--c),0 8px 40px -10px var(--c)}
.list h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;color:var(--c)}
.list h2 small{color:var(--mut);font-weight:500}
.row{display:grid;grid-template-columns:42px 1fr 30px;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;background:#0d1324;margin-bottom:6px;font-size:13px;animation:in .3s}
.row b{font-size:11px;color:var(--bg);background:var(--c);border-radius:6px;text-align:center;padding:3px 0}
.row i{font-style:normal;font-weight:800;text-align:right}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:18px 0}
.stage{text-align:center;min-width:0}
.turn{font-size:15px;color:var(--mut);margin:8px 0 18px}
.turn b{color:var(--c);font-size:20px}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px}.cards .card{flex:0 0 calc(20% - 10px);max-width:260px;min-width:0}
.card{--g1:#e9d27a;--g2:#9c7a1f;position:relative;border-radius:16px;padding:14px 10px 12px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#1a1405;cursor:pointer;text-align:center;animation:flip .6s both;animation-delay:calc(var(--i)*.12s);transition:transform .2s,filter .3s,opacity .3s;border:none;font:inherit}
.card:hover:not(.dim):not(.locked){transform:translateY(-6px) scale(1.03)}
.card.t3{--g1:#c9a6ff;--g2:#4b2a96;color:#fff}
.card.t1{--g1:#d3d8e3;--g2:#6e7686;color:#10141f}
.card.dim{opacity:.35;filter:grayscale(.7);cursor:default}
.card.won{outline:3px solid var(--acc);transform:translateY(-6px)}
.locked{cursor:default}
.ovr{font-size:38px;font-weight:900;line-height:1}
.pos{font-size:13px;font-weight:800;letter-spacing:.08em;margin-top:2px}
.nm{font-weight:900;font-size:clamp(16px,1.7vw,22px);text-transform:uppercase;letter-spacing:.02em;margin:12px 0;min-height:58px;display:flex;align-items:center;justify-content:center;line-height:1.05;overflow-wrap:anywhere;text-shadow:0 1px 0 #fff3}
.st{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;text-align:left;border-top:1px solid #0003;padding-top:8px}
.st span{display:flex;justify-content:space-between}
.st em{font-style:normal;font-weight:800}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button.b{font:inherit;font-weight:800;padding:14px 28px;border-radius:999px;border:0;cursor:pointer;background:var(--acc);color:#03241a;font-size:16px;transition:.2s}
button.b:hover{transform:translateY(-2px);filter:brightness(1.1)}
button.b.alt{background:transparent;color:var(--txt);border:1.5px solid var(--line)}
button.b.alt:hover{border-color:var(--acc)}
.hint{color:var(--mut);font-size:13px;margin:-8px 0 16px}
.big{height:200px;display:grid;place-items:center;font-size:56px;opacity:.9;margin-bottom:10px}
.reset{background:none;border:0;color:var(--mut);cursor:pointer;margin-top:26px;font:inherit;font-size:12px}
@keyframes flip{from{opacity:0;transform:rotateY(90deg) translateY(20px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}

.wrap{max-width:1500px;margin:auto;padding:12px 16px 40px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 4px}
.chip{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--panel);color:var(--txt);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;transition:.2s}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip small{color:var(--mut);font-weight:600}
.chip:hover{border-color:var(--c)}
.chip.on{background:var(--c);color:#06101f;border-color:var(--c)}
.chip.on small{color:#06101fb0}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:30px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;transition:.25s}
.list.active{box-shadow:0 0 0 2px var(--c),0 8px 40px -10px var(--c)}
.cap{color:var(--mut);font-size:12px;text-align:center;margin-bottom:6px}
.setup{max-width:560px;margin:30px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.setup h2{margin:0 0 4px}
.num{display:flex;gap:8px;justify-content:center;margin:16px 0 20px;flex-wrap:wrap}
.num button{font:inherit;font-weight:800;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#0d1324;color:var(--txt);cursor:pointer}
.num button.on{background:var(--acc);color:#03241a;border-color:var(--acc)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.names input{font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:#0d1324;color:var(--txt);border-left:5px solid var(--c);min-width:0}
@media(max-width:900px){.cards .card{flex-basis:calc(33.333% - 8px)}}
@media(max-width:560px){.cards .card{flex-basis:calc(50% - 6px)}.wrap{padding:8px 10px}.names{grid-template-columns:1fr}.row{grid-template-columns:38px 1fr 26px;font-size:12px}}

.eye{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:#0000002e;color:inherit;transition:.2s;padding:0}
.eye:hover{background:#00000055;transform:scale(1.12)}
.row{cursor:pointer}.row:hover{background:#18213a}
.mbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px;animation:in .2s;overflow:auto}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.x{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer;line-height:1}
.mh{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.movr{font-size:52px;font-weight:900;color:var(--acc);line-height:1}
.mnm{font-size:24px;font-weight:900;text-transform:uppercase}
.msub{color:var(--mut);font-size:14px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.info div{background:#0d1324;border-radius:10px;padding:8px 10px}
.info small{display:block;color:var(--mut);font-size:11px}
.info b{font-size:14px}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.grp h4{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.at{display:grid;grid-template-columns:1fr 70px 26px;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
.bar{height:6px;background:#0d1324;border-radius:4px;overflow:hidden}.bar u{display:block;height:100%;border-radius:4px}
.at em{font-style:normal;font-weight:800;text-align:right}

.tiers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 6px}
.tb{font:inherit;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#0d1324;color:var(--mut);cursor:pointer;transition:.2s}
.tb i{width:12px;height:12px;border-radius:50%;background:var(--tc);opacity:.45}
.tb small{opacity:.7}
.tb.on{color:var(--txt);border-color:var(--tc);box-shadow:0 0 0 1px var(--tc) inset}
.tb.on i{opacity:1}
.hint2{color:var(--mut);font-size:12px;margin:6px 0 20px}
button.b:disabled{opacity:.4;cursor:not-allowed;transform:none}
.rbrow{display:flex;gap:12px;align-items:center;justify-content:center;margin:12px 0 4px;color:var(--mut);font-size:13px}
.sw{width:46px;height:26px;border-radius:999px;border:0;background:#2a3350;position:relative;cursor:pointer;padding:0;transition:.2s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on i{left:23px}
.qm{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mut);background:none;color:var(--mut);font:inherit;font-weight:800;font-size:12px;cursor:pointer;margin-left:6px;padding:0;line-height:1;vertical-align:middle;transition:.2s}
.qm:hover{color:var(--acc);border-color:var(--acc)}
.tt{width:100%;border-collapse:collapse;font-size:13px;text-align:center;min-width:620px}
.tt th{padding:10px 6px;color:#1a1a1a;font-weight:800;border:1px solid var(--line)}
.tt th:first-child,.tt th:last-child{background:#0d1324;color:var(--txt)}
.tt th.pp{background:#0d1324;color:var(--txt);text-align:left;padding-left:12px}
.tt td{padding:8px 6px;border:1px solid var(--line);background:#0d1324}
.tt td b{display:block;font-size:14px}
.tt td small{color:var(--mut);font-size:11px}
.card{overflow:hidden}
.card.k0{background:linear-gradient(160deg,#c9a6ff,#4b2a96);color:#fff}
.card.k0 .st{border-top-color:#ffffff40}
.card.k1{background:linear-gradient(135deg,#fff3b0 0%,#f7cf4a 28%,#c8901a 62%,#ffe27a 85%,#e0a92a 100%);color:#000;box-shadow:0 0 22px -4px #f5c54299}
.card.k2{background:linear-gradient(160deg,#d9b44a,#b8932f);color:#000}
.card.k3{background:linear-gradient(135deg,#fafbfd 0%,#c4cad5 30%,#8a93a3 62%,#e9edf3 85%,#aab2c0 100%);color:#000}
.card.k4{background:linear-gradient(135deg,#fbd2a6 0%,#e0a066 32%,#b87440 65%,#efbb88 88%,#cf8a52 100%);color:#000}
.card.k1 .st,.card.k2 .st,.card.k3 .st,.card.k4 .st{border-top-color:#00000033}
.card.sh::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff3d 49%,transparent 58%);background-size:260% 100%;background-position:130% 0;animation:shine 4s ease-in-out infinite;pointer-events:none}
.eye{z-index:2}
.cards{perspective:1200px}
.card.static{animation:none}
.card.turn{animation:turnout .23s ease-in forwards;animation-delay:0s}
.card.unturn{animation:turnin .33s ease-out;animation-delay:0s}
@keyframes turnout{to{transform:rotateY(90deg)}}
@keyframes turnin{from{transform:rotateY(-90deg)}to{transform:none}}
.card.hid{box-shadow:0 0 28px -2px #9b5cffaa}
.back{position:absolute;inset:0;z-index:3;border-radius:inherit;background:radial-gradient(circle at 50% 40%,#5b25b8 0%,#24104f 40%,#08040f 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px #b084ff88,inset 0 0 40px #7a3df055}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#d9bcff66 48%,transparent 62%);background-size:260% 100%;background-position:130% 0;animation:shine 3s ease-in-out infinite;pointer-events:none}
.wc{font-weight:900;letter-spacing:.14em;font-size:clamp(11px,1.15vw,15px);text-align:center;line-height:1.25;color:#efe3ff;text-shadow:0 0 12px #9b5cff;position:relative}
.card{aspect-ratio:5/7;container-type:inline-size;display:flex;flex-direction:column;align-items:stretch;padding:6cqw 5cqw 5cqw}
.card .ovr{font-size:max(22cqw,30px)}
.card .pos{font-size:max(8cqw,12px);margin-top:1cqw}
.card .nm{font-size:max(10.5cqw,13px);margin:0;min-height:0;flex:1;padding:2cqw 0}
.card .st{font-size:max(7cqw,11px);gap:1cqw 6cqw;padding-top:3cqw}
.card .wc{font-size:max(8.5cqw,12px)}
.cards.wcs .card{flex:0 0 clamp(200px,24vw,300px);max-width:none}
.cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.card .nm{overflow-wrap:normal;word-break:normal;margin:0 -2cqw;padding:2cqw 0}
.card .nm span{display:block}
.row b.g0{background:color-mix(in srgb,var(--c) 60%,#000);color:#fff}
.row b.g1{background:color-mix(in srgb,var(--c) 88%,#000);color:#fff}
.row b.g2{background:color-mix(in srgb,var(--c) 85%,#fff);color:#06101f}
.row b.g3{background:color-mix(in srgb,var(--c) 66%,#fff);color:#06101f}
.row b.g4{background:color-mix(in srgb,var(--c) 44%,#fff);color:#06101f}
.setup .sub{font-size:15px;font-weight:800;color:var(--txt);letter-spacing:.01em}
.mimg{width:84px;height:84px;object-fit:contain;border-radius:12px}
@keyframes shine{0%,35%{background-position:130% 0}70%,100%{background-position:-60% 0}}
.hero{display:block;width:min(560px,80%);height:auto;margin:0 auto 22px;filter:drop-shadow(0 10px 30px #000a);animation:in .5s}
.pface{position:absolute;inset:0;z-index:3;border-radius:inherit;overflow:hidden;background:radial-gradient(circle at 50% 32%,#8a4cff 0%,#43208f 48%,#14072e 100%);box-shadow:inset 0 0 0 2px #b084ff88,inset 0 0 40px #7a3df055}
.pface img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:.93;transform:scale(1.06);transform-origin:50% 100%;filter:drop-shadow(0 6px 16px #000a)}
.pface .rays{position:absolute;left:-60%;top:-40%;width:220%;height:200%;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff22 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 8%,transparent 55%);mask-image:radial-gradient(circle at 50% 50%,#000 8%,transparent 55%);animation:spin 26s linear infinite}
.pface .halo{position:absolute;left:50%;top:46%;width:96%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #d9bcff66;box-shadow:inset 0 0 50px #9b5cff99,0 0 46px #9b5cff66}
.pface .spk{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1.4px,transparent 2px),radial-gradient(circle,#e9dcff 0 1px,transparent 1.6px);background-size:46px 58px,31px 37px;background-position:8px 12px,19px 30px;opacity:.55;animation:twk 2.4s ease-in-out infinite alternate}
.pface .wcs{position:absolute;left:50%;top:6%;width:70%;transform:translateX(-50%);opacity:.22}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twk{to{opacity:.15}}
.pface::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to top,#08040fd9,transparent);pointer-events:none}
.pn{position:absolute;left:3cqw;right:3cqw;bottom:4cqw;z-index:2;text-align:center;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:#fff;font-size:max(11cqw,13px);line-height:1.05;text-shadow:0 2px 8px #000b}
.pn span{display:block}
.card.ld .back{animation:ldp .8s ease-in-out infinite alternate}
@keyframes ldp{to{filter:brightness(1.5)}}
</style></head><body>
